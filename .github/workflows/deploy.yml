name: Deploy to Server

on:
  push:
    branches: [ DevOps ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/developer/Yandex-smart-audience

            # Подтягиваем свежий код из ветки DevOps
            git fetch --all
            git reset --hard origin/DevOps

            # Перезапускаем контейнеры
            docker compose up -d --build

            # Проверяем, что бэкенд жив.
            # Бэкенду нужно время на init_db() + recover_interrupted_runs() + старт uvicorn,
            # поэтому ждём с ретраями: до 20 попыток по 3 сек (60 сек максимум).
            for i in $(seq 1 20); do
              if curl -sf -m 3 http://127.0.0.1:8000/healthz > /dev/null; then
                echo "Backend is up (attempt $i)"
                exit 0
              fi
              echo "waiting for backend... ($i)"
              sleep 3
            done
            echo "Backend health check failed"
            exit 1
