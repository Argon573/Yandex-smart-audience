name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/developer/Yandex-smart-audience
            
            # Подтягиваем свежий код
            git fetch --all
            git reset --hard origin/main
            
            # Перезапускаем контейнеры (они сами пересоберутся при необходимости)
            docker compose up -d --build
            
            # Проверяем, что бэкенд жив
            sleep 5
            curl -sf http://127.0.0.1:8000/healthz || (echo "Backend health check failed" && exit 1)
