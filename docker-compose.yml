services:
  backend:
    build: ./backend
    # uvicorn на 8001: фронт-прокси (vite.config.ts) смотрит на localhost:8001,
    # поэтому frontend подключается network_mode к этому контейнеру.
    # nginx runs on the host and connects through Docker's bridge gateway.
    # Trust forwarded headers only from loopback and private Docker networks.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --proxy-headers --forwarded-allow-ips=127.0.0.1,172.16.0.0/12
    ports:
      - "127.0.0.1:8001:8001" # API доступен с хоста/nginx, не извне
      - "127.0.0.1:8000:8001" # совместимость с локальными клиентами
      - "127.0.0.1:5173:5173" # nginx продолжает проксировать фронтенд
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    # Общий сетевой namespace с backend: localhost:8001 внутри этого
    # контейнера — это uvicorn, что и ожидает vite-прокси без правки кода.
    network_mode: "service:backend"
    depends_on:
      - backend
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true" # HMR через bind-mount на macOS
      # пусто = прямые запросы идут через vite-прокси на /api (тот же origin,
      # без CORS); переопределяет VITE_API_BASE_URL из frontend/.env
      VITE_API_BASE_URL: ""
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # не смешивать с хостным node_modules

volumes:
  frontend_node_modules:
